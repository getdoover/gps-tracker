[project]
name = "gps-tracker"
version = "0.1.0"
description = "Doover processor that turns raw GPS fields in a device's messages into its map location and position tags"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.18.8",
]

[project.scripts]
export-config = "gps_tracker.app_config:export"
export-ui = "gps_tracker.app_ui:export"
export-notifications = "gps_tracker.app_notifications:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gps_tracker"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
